<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MS-XML(NUMAN)</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&display=swap');

        :root {
            --bg: #0d0d0d;
            --surface: #161616;
            --border: #2a2a2a;
            --accent: rgba(247, 226, 36, 0.96);
            --accent-dim: #f9900033;
            --text: #e8e8e8;
            --muted: #666;
            --success: #4ade80;
            --error: #f87171;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'JetBrains Mono', monospace;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 40px;
            width: 100%;
            max-width: 520px;
        }

        .header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 32px;
        }

        .logo {
            width: 36px;
            height: 36px;
            background: var(--accent);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: 700;
            color: #000;
            flex-shrink: 0;
        }

        .header-text h1 {
            font-size: 15px;
            font-weight: 700;
            color: var(--text);
            letter-spacing: 0.02em;
        }

        .header-text p {
            font-size: 11px;
            color: var(--muted);
            margin-top: 2px;
        }

        .schedule-badge {
            background: var(--accent-dim);
            border: 1px solid var(--accent);
            border-radius: 6px;
            padding: 10px 14px;
            font-size: 11px;
            color: var(--accent);
            margin-bottom: 28px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .schedule-badge::before {
            content: '⏰';
        }

        .btn {
            width: 100%;
            padding: 14px;
            background: var(--accent);
            color: #000;
            border: none;
            border-radius: 8px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.05em;
            cursor: pointer;
            transition: opacity 0.15s, transform 0.1s;
        }

        .btn:hover:not(:disabled) { opacity: 0.88; }
        .btn:active:not(:disabled) { transform: scale(0.99); }
        .btn:disabled { opacity: 0.4; cursor: not-allowed; }

        .status-box {
            margin-top: 24px;
            background: #111;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 16px;
            min-height: 64px;
            display: none;
        }

        .status-box.visible { display: block; }

        .status-label {
            font-size: 10px;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 8px;
        }

        .status-text {
            font-size: 13px;
            color: var(--text);
            line-height: 1.5;
        }

        .progress-bar {
            height: 2px;
            background: var(--border);
            border-radius: 2px;
            margin-top: 12px;
            overflow: hidden;
            display: none;
        }

        .progress-bar.visible { display: block; }

        .progress-fill {
            height: 100%;
            background: var(--accent);
            border-radius: 2px;
            width: 0%;
            transition: width 0.4s ease;
        }

        .progress-fill.indeterminate {
            width: 40%;
            animation: slide 1.4s ease-in-out infinite;
        }

        @keyframes slide {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(350%); }
        }

        .download-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-top: 12px;
            padding: 10px 16px;
            background: #0d2010;
            border: 1px solid var(--success);
            border-radius: 6px;
            color: var(--success);
            text-decoration: none;
            font-size: 12px;
            font-weight: 600;
            transition: background 0.15s;
        }

        .download-link:hover { background: #142818; }

        .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--accent);
            display: inline-block;
            animation: pulse 1.2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .error-text { color: var(--error); }
    </style>
</head>
<body>
    <div class="card">
        <div class="header">
            <div class="logo">K</div>
            <div class="header-text">
                <h1>KASPI XML GENERATOR (Numan)</h1>
                <p>МойСклад → Kaspi прайс-лист</p>
            </div>
        </div>

        <div class="schedule-badge">
            Автозапуск каждый день в 09:00 (Алматы)
        </div>

        <button class="btn" id="btn" onclick="startTask()">
            СГЕНЕРИРОВАТЬ СЕЙЧАС
        </button>

        <div class="status-box" id="statusBox">
            <div class="status-label">Статус</div>
            <div class="status-text" id="statusText"></div>
            <div class="progress-bar" id="progressBar">
                <div class="progress-fill indeterminate" id="progressFill"></div>
            </div>
        </div>
    </div>

    <script>
        let polling = null;

        function setStatus(text, type = 'default') {
            const box = document.getElementById('statusBox');
            const txt = document.getElementById('statusText');
            box.classList.add('visible');

            if (type === 'progress') {
                txt.innerHTML = `<span class="dot"></span> ${text}`;
            } else if (type === 'error') {
                txt.innerHTML = `<span class="error-text">✗ ${text}</span>`;
            } else {
                txt.innerHTML = text;
            }
        }

        function setProgress(visible) {
            const bar = document.getElementById('progressBar');
            bar.classList.toggle('visible', visible);
        }

        async function startTask() {
            const btn = document.getElementById('btn');
            btn.disabled = true;
            if (polling) clearInterval(polling);

            setStatus('Запуск задачи...', 'progress');
            setProgress(true);

            try {
                
                const res = await fetch('/run-task', {
                    method: 'POST',
                    headers: { 'X-API-Key': '7ba70e9c32c85080b1fd1dbccf8158c47aec85e8ec5e07aa59c553ffbf7a9a47' } 
                });
                const data = await res.json();
                checkStatus(data.task_id);
            } catch (e) {
                setStatus('Ошибка запуска задачи', 'error');
                setProgress(false);
                btn.disabled = false;
            }
        }

        async function checkStatus(id) {
            try {
                const res = await fetch(`/task-status/${id}`);
                const data = await res.json();

                if (data.task_status === 'SUCCESS') {
                    setProgress(false);
                    setStatus(
                        `✓ Готово! &nbsp;<a class="download-link" href="${data.task_result.file}" download>
                            ↓ Скачать XML
                        </a>
                        &nbsp;
                        <a class="download-link" href="${data.task_result.file}" target="_blank">
                            ↗ Открыть
                        </a>`
                    );
                    document.getElementById('btn').disabled = false;
                } else if (data.task_status === 'FAILURE') {
                    setProgress(false);
                    setStatus('Ошибка выполнения задачи. Проверьте логи.', 'error');
                    document.getElementById('btn').disabled = false;
                } else if (data.task_status === 'PROGRESS') {
                    const msg = data.task_result?.status || 'Обработка...';
                    setStatus(msg, 'progress');
                    setTimeout(() => checkStatus(id), 2000);
                } else {
                    setStatus(`${data.task_status}...`, 'progress');
                    setTimeout(() => checkStatus(id), 2000);
                }
            } catch (e) {
                setStatus('Ошибка соединения', 'error');
                setProgress(false);
                document.getElementById('btn').disabled = false;
            }
        }
    </script>
</body>
</html>
